name: FinPay CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'runners-part2-gcp/**'
  workflow_dispatch:

jobs:
  build-payment-api:
    name: Build Payment API
    runs-on: finpay-k8s-runner
    defaults:
      run:
        working-directory: ./runners-part2-gcp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Maven
        run: sudo apt-get update && sudo apt-get install -y maven

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Payment API (Maven)
        run: mvn clean package -f payment-api/pom.xml

  build-payment-worker:
    name: Build Payment Worker
    runs-on: finpay-k8s-runner
    defaults:
      run:
        working-directory: ./runners-part2-gcp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Maven
        run: sudo apt-get update && sudo apt-get install -y maven

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Payment Worker (Maven)
        run: mvn clean package -f payment-worker/pom.xml