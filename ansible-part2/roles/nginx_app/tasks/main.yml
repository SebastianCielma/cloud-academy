---
# tasks file for roles/nginx_app

- name: Assert required variables are defined
  ansible.builtin.assert:
    that:
      - replica_count | int > 0
      - htpasswd_user is defined
      - htpasswd_pass is defined
    fail_msg: "Required variables are not defined or invalid"
  tags:
    - always

- name: 1. Update the system package index
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  tags:
    - install

- name: 2. Install the NGINX web server and utils
  ansible.builtin.apt:
    name: 
      - "{{ nginx_package }}{% if nginx_version != 'latest' %}={{ nginx_version }}*{% endif %}"
      - apache2-utils
      - python3-passlib
    state: present
  tags:
    - install

- name: Create www group
  ansible.builtin.group:
    name: www
    state: present
  tags:
    - install
    - config

- name: Create www user
  ansible.builtin.user:
    name: www
    group: www
    system: yes
    create_home: no
  tags:
    - install
    - config

- name: Set up /var/www/html directory
  ansible.builtin.file:
    path: /var/www/html
    state: directory
    owner: www
    group: www
    mode: '0755'
  tags:
    - config

- name: Create .htpasswd file for NGINX
  community.general.htpasswd:
    path: /etc/nginx/.htpasswd
    name: "{{ htpasswd_user }}"
    password: "{{ htpasswd_pass }}"
    owner: root
    group: root
    mode: '0644'
  tags:
    - config
    - secrets

- name: Deploy versioned index.html
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: www
    group: www
    mode: '0644'
  tags:
    - config

- name: Ensure sensible main nginx.conf
  ansible.builtin.copy:
    dest: /etc/nginx/nginx.conf
    content: |
      user www;
      worker_processes auto;
      pid /run/nginx.pid;
      include /etc/nginx/modules-enabled/*.conf;

      events {
          worker_connections 768;
      }

      http {
          sendfile on;
          tcp_nopush on;
          types_hash_max_size 2048;
          include /etc/nginx/mime.types;
          default_type application/octet-stream;
          include /etc/nginx/conf.d/*.conf;
          include /etc/nginx/sites-enabled/*;
      }
    owner: root
    group: root
    mode: '0644'
  notify: Restart NGINX
  tags:
    - config

- name: Remove default NGINX site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Restart NGINX
  tags:
    - config

- name: Ensure conf.d directory has no default config
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  notify: Restart NGINX
  tags:
    - config

- name: Deploy templated NGINX configuration for instances
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "/etc/nginx/conf.d/instance-{{ item }}.conf"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ range(0, replica_count|int) | list }}"
  notify: Restart NGINX
  tags:
    - config

- name: Ensure the NGINX service is started and enabled
  ansible.builtin.service:
    name: nginx
    state: "{{ nginx_service_state }}"
    enabled: "{{ nginx_service_enabled }}"
  tags:
    - run

- name: Force all notified handlers to run at this point
  meta: flush_handlers

- name: Wait for NGINX to be ready before health check
  ansible.builtin.pause:
    seconds: 2
  tags:
    - run
    - healthcheck

- name: Health check to ensure all instances are running
  ansible.builtin.uri:
    url: "http://localhost:{{ base_port + item }}"
    status_code: 401
  loop: "{{ range(0, replica_count|int) | list }}"
  register: _health_check
  retries: 3
  delay: 3
  until: _health_check is success
  tags:
    - run
    - healthcheck