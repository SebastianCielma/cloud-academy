---
# tasks file for roles/nginx_app
- name: 1. Update the system package index
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: 2. Install the NGINX web server
  ansible.builtin.apt:
    name: "{{ nginx_package }}"
    state: present

- name: 3. Deploy static index.html
  ansible.builtin.copy:
    src: index.html
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: '0644'

- name: 4. Deploy templated NGINX configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart NGINX

- name: 5. Ensure the NGINX service is started and enabled
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: yes