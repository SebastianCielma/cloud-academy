nameOverride: ""
fullnameOverride: ""

namespace:
  create: true
  name: payment-prod

api:
  replicaCount: 2
  image:
    repository: acrpaymentplatform123.azurecr.io/payment-api
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  probes:
    liveness:
      path: /actuator/health/liveness
      initialDelaySeconds: 120
      periodSeconds: 15
    readiness:
      path: /actuator/health/readiness
      initialDelaySeconds: 100
      periodSeconds: 10
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

worker:
  replicaCount: 2
  image:
    repository: acrpaymentplatform123.azurecr.io/payment-worker
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"
  probes:
    liveness:
      path: /actuator/health/liveness
      initialDelaySeconds: 120
      periodSeconds: 15
    readiness:
      path: /actuator/health/readiness
      initialDelaySeconds: 100
      periodSeconds: 10
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

config:
  appEnv: "production"
  logLevel: "INFO"
  dbUrl: ""
  dbUser: "pgadmin"
  dbName: "paymentdb"

secretsStore:
  enabled: true
  provider: azure
  keyvaultName: ""
  tenantId: ""
  clientId: ""
  secrets:
    - objectName: db-password
      objectType: secret
      key: DB_PASSWORD

ingress:
  enabled: true
  className: azure-application-gateway
  annotations:
    appgw.ingress.kubernetes.io/ssl-redirect: "false"
    appgw.ingress.kubernetes.io/backend-protocol: "http"
    appgw.ingress.kubernetes.io/health-probe-path: "/actuator/health/readiness"
  hosts:
    - paths:
        - path: /
          pathType: Prefix
          service: api

networkPolicy:
  enabled: true
