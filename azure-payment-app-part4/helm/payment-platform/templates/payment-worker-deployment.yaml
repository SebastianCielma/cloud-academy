apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "payment-platform.fullname" . }}-worker
  labels:
    {{- include "payment-platform.workerLabels" . | nindent 4 }}
spec:
  {{- if not .Values.worker.hpa.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "payment-platform.workerSelectorLabels" . | nindent 6 }}
  strategy:
    type: {{ .Values.worker.strategy.type }}
    {{- if eq .Values.worker.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.worker.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.worker.strategy.rollingUpdate.maxUnavailable }}
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "payment-platform.workerSelectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.worker.service.targetPort }}
              protocol: TCP
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "payment-platform.configmapName" . }}
                  key: APP_ENV
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "payment-platform.configmapName" . }}
                  key: LOG_LEVEL
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "payment-platform.configmapName" . }}
                  key: DB_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "payment-platform.configmapName" . }}
                  key: DB_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "payment-platform.fullname" . }}-db-credentials
                  key: DB_PASSWORD
            - name: PAYMENT_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "payment-platform.configmapName" . }}
                  key: PAYMENT_API_BASE_URL
          livenessProbe:
            httpGet:
              path: {{ .Values.worker.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.worker.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.worker.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.worker.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.worker.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.worker.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- if .Values.secretsStore.enabled }}
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
          {{- end }}
      {{- if .Values.secretsStore.enabled }}
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "payment-platform.secretProviderClassName" . }}
      {{- end }}
