{{- if .Values.secretsStore.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "payment-platform.secretProviderClassName" . }}
  labels:
    {{- include "payment-platform.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.secretsStore.provider }}
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ .Values.secretsStore.clientId | quote }}
    keyvaultName: {{ .Values.secretsStore.keyvaultName | quote }}
    tenantId: {{ .Values.secretsStore.tenantId | quote }}
    objects: |
      array:
        {{- range .Values.secretsStore.secrets }}
        - |
          objectName: {{ .objectName }}
          objectType: {{ .objectType }}
        {{- end }}
  secretObjects:
    - secretName: {{ include "payment-platform.fullname" . }}-db-credentials
      type: Opaque
      data:
        {{- range .Values.secretsStore.secrets }}
        - objectName: {{ .objectName }}
          key: {{ .key }}
        {{- end }}
{{- end }}
