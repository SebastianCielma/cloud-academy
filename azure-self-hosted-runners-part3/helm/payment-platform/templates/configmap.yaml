apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "payment-platform.configmapName" . }}
  labels:
    {{- include "payment-platform.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  DB_URL: {{ .Values.config.dbUrl | quote }}
  DB_USER: {{ .Values.config.dbUser | quote }}
  DB_NAME: {{ .Values.config.dbName | quote }}
  PAYMENT_WORKER_BASE_URL: "http://{{ include "payment-platform.fullname" . }}-worker:{{ .Values.worker.service.port }}"
  PAYMENT_API_BASE_URL: "http://{{ include "payment-platform.fullname" . }}-api:{{ .Values.api.service.port }}"
