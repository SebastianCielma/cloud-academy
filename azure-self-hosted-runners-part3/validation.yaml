---
apiVersion: v1
kind: Namespace
metadata:
  name: preview-envs
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: preview-sa
  namespace: preview-envs
  annotations:
    azure.workload.identity/client-id: "09bb5050-1873-4979-862f-b51704e017d2"
  labels:
    azure.workload.identity/use: "true"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: blob-upload-validation
  namespace: preview-envs
spec:
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: preview-sa
      containers:
      - name: smoke-test-uploader
        image: mcr.microsoft.com/azure-cli:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "Test artifact generated by PR validation" > smoke-test-result.json
          
          echo "Logowanie do Azure bez hasla (Workload Identity)..."
          az login --federated-token "$(cat $AZURE_FEDERATED_TOKEN_FILE)" --service-principal -u $AZURE_CLIENT_ID -t $AZURE_TENANT_ID
          
          echo "Wgrywanie pliku do Blob Storage..."
          az storage blob upload \
            --account-name stfinpayprevseb123 \
            --container-name preview-artifacts \
            --name pr-999/smoke-test-result.json \
            --file smoke-test-result.json \
            --auth-mode login
            
          echo "smoke-test-result.json uploaded successfully to cloud storage."
      restartPolicy: Never