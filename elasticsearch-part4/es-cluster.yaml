apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: local-cluster
spec:
  version: 8.12.0
  nodeSets:
  - name: default
    count: 3 
    config:
      node.store.allow_mmap: false 
    podTemplate:
      spec:
        containers:
        - name: elasticsearch
          resources:
            requests:
              memory: 1Gi
              cpu: 0.2
            limits:
              memory: 1Gi
              cpu: 0.5 
    volumeClaimTemplates:
    - metadata:
        name: elasticsearch-data
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi 