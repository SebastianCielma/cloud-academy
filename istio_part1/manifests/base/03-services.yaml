apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: istio-demo
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
