apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payment-routing
  namespace: istio-part2
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: payment-service
      port: 8080
  rules:
    - matches:
        - method: GET
          path:
            type: Exact
            value: /payment
      filters:
        - type: RequestMirror
          requestMirror:
            backendRef:
              name: payment-service-v2
              port: 8080
      backendRefs:
        - name: payment-service-v1
          port: 8080
    - backendRefs:
        - name: payment-service-v1
          port: 8080
