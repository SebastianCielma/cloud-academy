apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payment-timeout
  namespace: istio-part3
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: payment-service
      port: 8080
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /payment/probe
      timeouts:
        request: 2s
        backendRequest: 2s
      backendRefs:
        - name: payment-service
          port: 8080
    - backendRefs:
        - name: payment-service
          port: 8080
