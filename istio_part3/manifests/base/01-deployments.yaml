apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      serviceAccountName: payment-service
      securityContext:
        fsGroup: 10001
      containers:
        - name: payment-service
          image: istio-part3/services:v1
          imagePullPolicy: Never
          env:
            - name: SERVICE_NAME
              value: payment-service
            - name: PAYMENT_MAX_IN_FLIGHT
              value: "32"
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: payment-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
      volumes:
        - name: payment-data
          emptyDir: {}
---
