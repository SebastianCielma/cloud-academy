apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: istio-part3-sidecar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      serviceAccountName: order-service
      containers:
        - name: order-service
          image: istio-part3/services:v1
          imagePullPolicy: Never
          env:
            - name: SERVICE_NAME
              value: order-service
            - name: PAYMENT_URL
              value: http://payment-service.istio-part3-sidecar.svc.cluster.local:8080
            - name: INVENTORY_URL
              value: http://inventory-service.istio-part3-sidecar.svc.cluster.local:8080
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: istio-part3-sidecar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      serviceAccountName: payment-service
      securityContext:
        fsGroup: 10001
      containers:
        - name: payment-service
          image: istio-part3/services:v1
          imagePullPolicy: Never
          env:
            - name: SERVICE_NAME
              value: payment-service
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: payment-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
      volumes:
        - name: payment-data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
