apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: istio-part4
  labels: {}
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: istio-part4
  labels: {}
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: istio-part4
  labels:
    istio.io/use-waypoint: payment-waypoint
spec:
  selector:
    app: payment-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: istio-part4
  labels: {}
spec:
  selector:
    app: inventory-service
  ports:
    - name: http
      port: 8080
      targetPort: http
