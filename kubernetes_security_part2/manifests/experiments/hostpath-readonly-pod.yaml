apiVersion: v1
kind: Pod
metadata:
  name: hostpath-readonly-test
  namespace: security-experiments
  labels:
    app: hostpath-readonly-test
    security-lab/temporary: "true"
spec:
  restartPolicy: Never
  automountServiceAccountToken: false

  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: reader
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 3600

      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL

      volumeMounts:
        - name: host-demo
          mountPath: /mnt/host-demo
          readOnly: true

      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi

  volumes:
    - name: host-demo
      hostPath:
        path: /tmp/k8s-security-hostpath-demo
        type: Directory