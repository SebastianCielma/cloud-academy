apiVersion: v1
kind: Pod
metadata:
  name: privileged-test
  namespace: security-experiments
  labels:
    app: privileged-test
    security-lab/temporary: "true"
spec:
  automountServiceAccountToken: false
  restartPolicy: Never

  containers:
    - name: security-test
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 3600

      securityContext:
        privileged: true

      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi