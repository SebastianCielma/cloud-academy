apiVersion: v1
kind: Pod
metadata:
  name: resource-limits-test
  namespace: security-experiments
  labels:
    app: resource-limits-test
    security-lab/temporary: "true"
spec:
  restartPolicy: Never
  automountServiceAccountToken: false

  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 3600

      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL

      resources:
        requests:
          cpu: 25m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi