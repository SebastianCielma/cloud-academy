apiVersion: v1
kind: Pod
metadata:
  name: psa-privileged-denied
  namespace: psa-lab
  labels:
    app: psa-privileged-denied
spec:
  automountServiceAccountToken: false
  restartPolicy: Never

  containers:
    - name: test
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 60

      securityContext:
        privileged: true

      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi