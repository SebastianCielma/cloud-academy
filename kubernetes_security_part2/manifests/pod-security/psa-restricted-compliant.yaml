apiVersion: v1
kind: Pod
metadata:
  name: psa-restricted-compliant
  namespace: psa-lab
  labels:
    app: psa-restricted-compliant
spec:
  restartPolicy: Never
  automountServiceAccountToken: false

  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: test
      image: busybox:1.36

      command:
        - sh
        - -c
        - sleep 3600

      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL

      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi