apiVersion: v1
kind: Pod
metadata:
  name: secret-env-test
  namespace: security-lab
  labels:
    app: secret-env-test
    security-lab/temporary: "true"
spec:
  restartPolicy: Never
  automountServiceAccountToken: false

  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 3600

      env:
        - name: PAYMENT_API_KEY
          valueFrom:
            secretKeyRef:
              name: payment-secret
              key: PAYMENT_API_KEY

        - name: PAYMENT_MODE
          valueFrom:
            secretKeyRef:
              name: payment-secret
              key: PAYMENT_MODE

      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL

      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi