apiVersion: v1
kind: Pod
metadata:
  name: secret-volume-test
  namespace: security-lab
  labels:
    app: secret-volume-test
    security-lab/temporary: "true"
spec:
  restartPolicy: Never
  automountServiceAccountToken: false

  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 3600

      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL

      volumeMounts:
        - name: payment-credentials
          mountPath: /run/secrets/payment
          readOnly: true

      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi

  volumes:
    - name: payment-credentials
      secret:
        secretName: payment-secret
        defaultMode: 0444