apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: part3-allow-frontend-to-api
  namespace: payments
spec:
  podSelector:
    matchLabels:
      app: part3-payment-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              access: payments
          podSelector:
            matchLabels:
              app: part3-frontend
      ports:
        - protocol: TCP
          port: 8080
