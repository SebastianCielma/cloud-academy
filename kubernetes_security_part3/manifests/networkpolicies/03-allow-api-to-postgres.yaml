apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: part3-allow-api-to-postgres
  namespace: payments
spec:
  podSelector:
    matchLabels:
      app: part3-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: part3-payment-api
      ports:
        - protocol: TCP
          port: 5432
