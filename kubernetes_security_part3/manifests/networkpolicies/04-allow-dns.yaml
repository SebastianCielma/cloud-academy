apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: part3-allow-dns
  namespace: payments
spec:
  podSelector:
    matchLabels:
      app: part3-payment-api
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
