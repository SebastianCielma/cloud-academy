apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: part3-allow-api-egress-postgres
  namespace: payments
spec:
  podSelector:
    matchLabels:
      app: part3-payment-api
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: part3-postgres
      ports:
        - protocol: TCP
          port: 5432
