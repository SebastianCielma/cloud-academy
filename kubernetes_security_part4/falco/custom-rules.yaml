- rule: Part4 Shell Spawned In Container
  desc: A shell was started in a container in the lab
  condition: >
    spawned_process and container and
    proc.name in (sh, bash, ash, dash) and
    k8s.ns.name in (part4-runtime, part4-incident)
  output: >
    PART4 shell spawned (user=%user.name command=%proc.cmdline
    container=%container.name pod=%k8s.pod.name ns=%k8s.ns.name)
  priority: WARNING
  tags: [part4, runtime, shell]
- rule: Part4 Sensitive File Read
  desc: A lab container read the passwd file
  condition: >
    open_read and container and fd.name = /etc/passwd and
    k8s.ns.name in (part4-runtime, part4-incident)
  output: >
    PART4 sensitive file read (file=%fd.name command=%proc.cmdline
    pod=%k8s.pod.name ns=%k8s.ns.name)
  priority: NOTICE
  tags: [part4, filesystem]
