- rule: Part4 Shell Spawned In Container
  desc: Detect shell execution inside a lab container
  condition: >
    spawned_process and container and
    proc.name in (sh, bash, ash, dash) and
    k8s.ns.name in (part4-runtime, part4-incident)
  output: >
    PART4_SHELL_DETECTED
    user=%user.name
    command=%proc.cmdline
    pod=%k8s.pod.name
    namespace=%k8s.ns.name
  priority: WARNING
  tags: [part4, runtime, shell]

- rule: Part4 Sensitive File Read
  desc: Detect access to sensitive files inside lab containers
  condition: >
    open_read and container and
    fd.name in (/etc/passwd, /etc/shadow) and
    k8s.ns.name in (part4-runtime, part4-incident)
  output: >
    PART4_SENSITIVE_FILE_READ
    file=%fd.name
    command=%proc.cmdline
    pod=%k8s.pod.name
    namespace=%k8s.ns.name
  priority: NOTICE
  tags: [part4, filesystem]

- rule: Part4 Suspicious Network Tool
  desc: Detect execution of network utilities inside lab containers
  condition: >
    spawned_process and container and
    proc.name in (nc, netcat, ncat, wget, curl) and
    k8s.ns.name in (part4-runtime, part4-incident)
  output: >
    PART4_NETWORK_TOOL_EXECUTED
    command=%proc.cmdline
    pod=%k8s.pod.name
    namespace=%k8s.ns.name
  priority: WARNING
  tags: [part4, network]
