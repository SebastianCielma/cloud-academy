apiVersion: apps/v1
kind: Deployment
metadata:
  name: hardened-example
  namespace: part4-incident
  labels: {owner: security-team, environment: lab, application: hardened-example}
spec:
  replicas: 1
  selector:
    matchLabels: {app: hardened-example}
  template:
    metadata:
      labels: {app: hardened-example, owner: security-team, environment: lab, application: hardened-example}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: docker.io/library/busybox:1.36.1
          command: ["/bin/sh", "-c", "sleep 360000"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
