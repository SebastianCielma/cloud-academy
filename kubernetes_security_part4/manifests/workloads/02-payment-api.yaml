apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-api
  namespace: part4-incident
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: part4-incident
  labels:
    application: payment-api
    owner: security-team
    environment: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
        application: payment-api
        owner: security-team
        environment: lab
    spec:
      serviceAccountName: payment-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: docker.io/library/busybox:1.36.1
          command: ["/bin/sh", "-c", "sleep 360000"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
