worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;
    server_tokens off;


    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    server {
        listen 443 ssl;
        server_name api.internal.test;

        ssl_certificate     /etc/nginx/certs/servers/api.internal.test/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/servers/api.internal.test/server.key;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;

        location /api {
            proxy_pass http://api-service:5678;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /payments {
            proxy_pass http://payments-service:5678;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 8443 ssl;
        server_name api.internal.test;

        ssl_certificate     /etc/nginx/certs/servers/api.internal.test/server.crt;
        ssl_certificate_key /etc/nginx/certs/servers/api.internal.test/server.key;

        location / {
            proxy_pass http://api-service:5678;
        }
    }
}
