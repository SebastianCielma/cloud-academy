services:
  nginx-edge:
    image: nginx:1.27-alpine
    container_name: mtls-nginx-edge
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../pki/out:/etc/nginx/certs:ro
    networks:
      edge_net:
        aliases:
          - payments.internal.test
      backend_net:
    depends_on:
      - payment-service

  payment-service:
    image: hashicorp/http-echo:1.0
    container_name: mtls-payment-service
    command:
      - "-listen=:5678"
      - "-text={\"service\":\"payment-service\",\"status\":\"accepted\"}"
    networks:
      - backend_net

  order-service:
    image: alpine:3.20
    container_name: mtls-order-service
    command: sh -c "apk add --no-cache curl openssl >/dev/null && sleep infinity"
    volumes:
      - ../pki/out/clients/order-service:/certs/client:ro
      - ../pki/out/trust:/certs/trust:ro
    networks:
      - edge_net
    depends_on:
      - nginx-edge

networks:
  edge_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true
