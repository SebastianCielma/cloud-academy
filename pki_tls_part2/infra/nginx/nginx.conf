worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;
    server_tokens off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    map $ssl_client_s_dn $client_cn {
        default "unknown";
        ~(^|,)CN=(?<cn>[^,]+) $cn;
    }

    
    server {
        listen 80;
        server_name payments.internal.test;

        location /crl/ {
            alias /etc/nginx/certs/crl/;
            default_type application/pkix-crl;
        }
    }

    
    server {
        listen 443 ssl;
        server_name payments.internal.test;

        ssl_certificate        /etc/nginx/certs/servers/payments.internal.test/current/fullchain.pem;
        ssl_certificate_key    /etc/nginx/certs/servers/payments.internal.test/current/payments.internal.test.key;

        ssl_client_certificate /etc/nginx/certs/trust/company-truststore.pem;
        ssl_verify_client      on;
        ssl_verify_depth       2;
        ssl_crl                /etc/nginx/certs/crl/crl-bundle.pem;

        location /payments/status {
            proxy_pass http://payment-service:5678;
            proxy_set_header Host $host;
            proxy_set_header X-Client-Identity $client_cn;
            proxy_set_header X-Client-Serial $ssl_client_serial;
            add_header X-Authenticated-Client $client_cn always;
            add_header X-Client-Cert-Serial $ssl_client_serial always;
        }

        location /payments/charge {
            if ($client_cn != "order-service") {
                return 403 '{"error":"forbidden","reason":"client_identity_not_authorized","authenticated_cn":"$client_cn"}\n';
            }
            proxy_pass http://payment-service:5678;
            proxy_set_header Host $host;
            proxy_set_header X-Client-Identity $client_cn;
            proxy_set_header X-Client-Serial $ssl_client_serial;
            add_header X-Authenticated-Client $client_cn always;
            add_header X-Client-Cert-Serial $ssl_client_serial always;
        }
    }

    
    server {
        listen 8443 ssl;
        server_name payments.internal.test;

        ssl_certificate        /etc/nginx/certs/servers/payments.internal.test/current/payments.internal.test.crt;
        ssl_certificate_key    /etc/nginx/certs/servers/payments.internal.test/current/payments.internal.test.key;
        ssl_client_certificate /etc/nginx/certs/trust/company-truststore.pem;
        ssl_verify_client      on;
        ssl_verify_depth       2;

        location / {
            proxy_pass http://payment-service:5678;
        }
    }

    
    server {
        listen 8444 ssl;
        server_name payments.internal.test;

        ssl_certificate        /etc/nginx/certs/servers/wrong-san/current/fullchain.pem;
        ssl_certificate_key    /etc/nginx/certs/servers/wrong-san/current/wrong-san.key;
        ssl_client_certificate /etc/nginx/certs/trust/company-truststore.pem;
        ssl_verify_client      on;
        ssl_verify_depth       2;

        location / {
            proxy_pass http://payment-service:5678;
        }
    }

    
    server {
        listen 8445 ssl;
        server_name payments.internal.test;

        ssl_certificate        /etc/nginx/certs/servers/payments.internal.test/current/fullchain.pem;
        ssl_certificate_key    /etc/nginx/certs/servers/payments.internal.test/current/payments.internal.test.key;
        ssl_client_certificate /etc/nginx/certs/trust/company-truststore.pem;
        ssl_verify_client      on;
        ssl_verify_depth       2;

        location /payments/status {
            proxy_pass http://payment-service:5678;
            add_header X-Authenticated-Client $client_cn always;
        }
    }
}
