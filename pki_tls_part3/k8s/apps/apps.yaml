apiVersion: v1
kind: Namespace
metadata:
  name: apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo:1.0
          args:
            - "-listen=:5678"
            - '-text={"service":"api-service","tls":"cert-manager-acme"}'
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: apps
spec:
  selector:
    app: api-service
  ports:
    - port: 80
      targetPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-service
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-service
  template:
    metadata:
      labels:
        app: payments-service
    spec:
      containers:
        - name: payments
          image: hashicorp/http-echo:1.0
          args:
            - "-listen=:5678"
            - '-text={"service":"payments-service","tls":"cert-manager-acme"}'
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: payments-service
  namespace: apps
spec:
  selector:
    app: payments-service
  ports:
    - port: 80
      targetPort: 5678
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: api-internal-cert
  namespace: apps
spec:
  secretName: api-internal-tls
  duration: 1h
  renewBefore: 57m
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - api.internal.test
  issuerRef:
    name: step-ca-acme
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: payments-internal-cert
  namespace: apps
spec:
  secretName: payments-internal-tls
  duration: 1h
  renewBefore: 57m
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - payments.internal.test
  issuerRef:
    name: step-ca-acme
    kind: ClusterIssuer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apps-ingress
  namespace: apps
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.internal.test
      secretName: api-internal-tls
    - hosts:
        - payments.internal.test
      secretName: payments-internal-tls
  rules:
    - host: api.internal.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 80
    - host: payments.internal.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: payments-service
                port:
                  number: 80
