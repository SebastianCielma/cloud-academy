apiVersion: v1
kind: Namespace
metadata:
  name: step-ca
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: step-ca
  namespace: step-ca
spec:
  replicas: 1
  selector:
    matchLabels:
      app: step-ca
  template:
    metadata:
      labels:
        app: step-ca
    spec:
      containers:
        - name: step-ca
          image: smallstep/step-ca:0.27.4
          command: ["step-ca"]
          args:
            - /home/step/config/ca.json
            - --password-file=/home/step/secrets/password.txt
          ports:
            - containerPort: 9000
              name: https
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /home/step/config
              readOnly: true
            - name: certs
              mountPath: /home/step/certs
              readOnly: true
            - name: secrets
              mountPath: /home/step/secrets
              readOnly: true
            - name: db
              mountPath: /home/step/db
      volumes:
        - name: config
          configMap:
            name: step-ca-config
        - name: certs
          configMap:
            name: step-ca-certs
        - name: secrets
          secret:
            secretName: step-ca-secrets
        - name: db
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: step-ca
  namespace: step-ca
spec:
  selector:
    app: step-ca
  ports:
    - name: https
      port: 9000
      targetPort: 9000
