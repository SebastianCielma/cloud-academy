services:
  payment-service:
    image: nginx:1.27-alpine
    container_name: pki4-payment
    ports:
      - "8441:443"
    volumes:
      - ./nginx/payment.conf:/etc/nginx/conf.d/default.conf:ro
      - ../.local/pki:/etc/nginx/pki:ro

  order-service:
    image: nginx:1.27-alpine
    container_name: pki4-order
    ports:
      - "8442:443"
    volumes:
      - ./nginx/order.conf:/etc/nginx/conf.d/default.conf:ro
      - ../.local/pki:/etc/nginx/pki:ro

  inventory-service:
    image: nginx:1.27-alpine
    container_name: pki4-inventory
    ports:
      - "8443:443"
    volumes:
      - ./nginx/inventory.conf:/etc/nginx/conf.d/default.conf:ro
      - ../.local/pki:/etc/nginx/pki:ro
