server {
    listen 443 ssl;
    server_name inventory.internal.test;

    ssl_certificate     /etc/nginx/pki/services/inventory-v2-fullchain.crt;
    ssl_certificate_key /etc/nginx/pki/services/inventory-v2.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        default_type application/json;
        return 200 '{"service":"inventory-service","status":"ok","ca_version":"v2"}';
    }
}
