server {
    listen 443 ssl;
    server_name payment.internal.test;

    ssl_certificate     /etc/nginx/pki/services/payment-v2-fullchain.crt;
    ssl_certificate_key /etc/nginx/pki/services/payment-v2.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    ssl_client_certificate /etc/nginx/pki/trust/dual-int-bundle.pem;
    ssl_verify_client on;
    ssl_verify_depth 2;

    location / {
        default_type application/json;
        return 200 '{"service":"payment-service","status":"ok","ca_version":"v2"}';
    }
}
