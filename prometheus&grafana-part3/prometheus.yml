global:
  scrape_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus_local'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'linux_node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'example_app'
    static_configs:
      - targets: ['example-app:8080']

  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://example-app:8080/', 'http://example-app:8080/err']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115