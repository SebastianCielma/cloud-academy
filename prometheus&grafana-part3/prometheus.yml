global:
  scrape_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus_local'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'linux_node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'example_app'
    static_configs:
      - targets: ['example-app:8080']