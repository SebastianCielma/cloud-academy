apiVersion: v1
kind: Service
metadata:
  name: {{ include "finpay.fullname" . }}-api
  labels:
    {{- include "finpay.labels" . | nindent 4 }}
    app: payment-api
spec:
  type: {{ .Values.api.service.type }}
  ports:
  - port: {{ .Values.api.service.port }}
    targetPort: {{ .Values.api.service.targetPort }}
    protocol: TCP
    name: http
  selector:
    {{- include "finpay.selectorLabels" . | nindent 4 }}
    app: payment-api
