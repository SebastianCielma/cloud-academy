api:
  replicaCount: 2
  image:
    repository: 834948575491.dkr.ecr.eu-central-1.amazonaws.com/finpay/payment-api
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer 
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

worker:
  replicaCount: 2
  image:
    repository: 834948575491.dkr.ecr.eu-central-1.amazonaws.com/finpay/payment-worker
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1000m" 
      memory: "512Mi"

config:
  appEnv: "production"
  logLevel: "INFO"
  dbUrl: "" 
  dbUser: "postgres"
  dbPassword: "" 

ingress:
  enabled: false
