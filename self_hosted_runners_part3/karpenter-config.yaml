---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: ci-runners
spec:
  amiFamily: AL2023
  role: "finpay-production-cluster-karpenter-node"
  
  subnetSelectorTerms:
    - tags:
        "kubernetes.io/role/internal-elb": "1"
  securityGroupSelectorTerms:
    - tags:
        "karpenter.sh/discovery": "finpay-production-cluster"

---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: ci-runners
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ci-runners
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["m5", "c5", "t3"]
        - key: karpenter.k8s.aws/instance-size
          operator: NotIn
          values: ["nano", "micro", "small"] 
      taints:
        - key: ci-workload
          value: "true"
          effect: NoSchedule